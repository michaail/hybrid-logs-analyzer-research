# All relative paths are resolved from --workspace-root, never from the
# notebook's current directory.  In Colab this is /content/workspace.
experiment:
  name: baseline_full
  dataset: bgl
  run_id: null
  seed: 42

paths:
  raw_dir: data/raw
  artifact_dir: artifacts
  models_dir: models
  outputs_dir: outputs

parser:
  hdfs:
    raw_file: hdfs/HDFS_full.log
    config: configs/drain.ini
  bgl:
    raw_file: bgl/BGL_full.log
    config: configs/drain_bgl.ini

sequencing:
  hdfs:
    # stratified = all-block IID; topology_grouped keeps every provisional
    # ordered-template fingerprint in exactly one partition.
    split: stratified
  bgl:
    window_minutes: 20
    # Window inside each time split. Overlap is allowed within a split only.
    step_minutes: 20
    # Cut the event stream before windowing (inductive_v1). stratified = notebook-era.
    split: time
    # Exclude events near train/validation and validation/test boundaries.
    embargo_minutes: 20

ablation:
  llm_enrichment_enabled: true
  enrichment_model_size: large  # Deepseek v4 Pro; small/both are not used
  # Thesis-comparable HDFS graphs use the original notebook feature encoding.
  # Set stabilized_v2 only as an explicit Family A arm.
  feature_contract: notebook_raw_v1
  representation:
    # train_only = inductive_v1 (Drain + TF-IDF fit on train units).
    # all = transductive_v1 notebook ceiling; do not mix split locks.
    fit_on: train_only
  embeddings:
    tfidf_enabled: true
    sbert_enabled: true
    # embedding_text = LLM paragraph only (template fallback if enrichment is off).
    # grounded_v1 = enrichment fields only; MiniLM never sees Drain templates.
    sbert_text: embedding_text
  fusion:
    # all = reconstruct every node column. without_sbert = TF-IDF + extras only.
    node_reconstruct: all
    # concat preserves the legacy model. projected_gated gives each modality an
    # equal-width Linear+LayerNorm branch and learns softmax fusion gates.
    mode: concat
    modality_projection_dim: 64
    # global = MSE over columns. block_balanced first averages within modality.
    node_loss: global
    node_block_weights:
      tfidf: 1.0
      sbert: 1.0
      extras: 1.0
  graph:
    use_edge_features: true
    # Feature-group ablations remove these columns from graph input and node/
    # edge reconstruction targets; topology and transition count remain intact.
    node_positional_features: true
    edge_temporal_features: true
    edge_positional_features: true
    # HDFS blocks with identical template order may differ in parameters and timing.
    # Keep every attributed block graph; topology-only deduplication is opt-in.
    unique_sequences: false
    gine_aggregation: sum
    node_transformation: mlp
    # Directed concat-MLP. Family B arm inner_product is the symmetric decoder.
    structure_decoder: mlp

training:
  train_mode: clean
  test_run: false
  test_samples: 5000
  hidden_dim: 128
  latent_dim: 64
  batch_size: 256
  epochs: 25
  learning_rate:
    hdfs: 0.01
    bgl: 0.001
  alpha: 1.0
  beta: 1.0
  gamma: 1.0
  pre_normalize_edges: true
  minimum_edge_std: 0.1

baseline:
  isolation_forest:
    seeds: [13, 29, 42, 71, 101]
    n_estimators: 300
    max_samples: 256
