[PROFILING]
enabled = False
report_sec = 60

[SNAPSHOT]
snapshot_interval_minutes = 5
compress_state = False

[DRAIN]
sim_th = 0.4
depth = 4
max_children = 100
max_clusters = 1000
extra_delimiters = []

[MASKING]
masking = [
  {"regex_pattern": "blk_-?\\d+", "mask_with": "BLK"},
  {"regex_pattern": "(?:\\d{1,3}\\.){3}\\d{1,3}(?::\\d+)?", "mask_with": "IP"},
  {"regex_pattern": "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}", "mask_with": "UUID"},
  {"regex_pattern": "\\b0x[0-9a-fA-F]+\\b", "mask_with": "HEX"}
  ]
mask_prefix = <
mask_suffix = >
