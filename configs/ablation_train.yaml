# Family B — architecture / loss / hyperparameter ablations.
# All arms reuse one frozen graph_dataset.pt (the Family A baseline_full bundle
# or an equivalent notebook_raw_v1 hybrid graph). Safe with --mode train-only.
#
# Launch:
#   python run_ablation.py --mode train-only \
#     --config configs/ablation_base.yaml \
#     --matrix configs/ablation_train.yaml \
#     --graph-dataset path/to/baseline_full/graph_dataset.pt
family: train
requires_graph_rebuild: false
experiments:
  - name: baseline_full
    enabled: true
    requires_graph_rebuild: false
    overrides:
      experiment.name: baseline_full

  - name: gine_mean_agg
    enabled: true
    requires_graph_rebuild: false
    overrides:
      experiment.name: gine_mean_agg
      ablation.graph.gine_aggregation: mean

  - name: gine_max_agg
    enabled: true
    requires_graph_rebuild: false
    overrides:
      experiment.name: gine_max_agg
      ablation.graph.gine_aggregation: max

  - name: linear_node_transform
    enabled: true
    requires_graph_rebuild: false
    overrides:
      experiment.name: linear_node_transform
      ablation.graph.node_transformation: linear

  - name: latent_32
    enabled: true
    requires_graph_rebuild: false
    overrides:
      experiment.name: latent_32
      training.latent_dim: 32

  - name: hidden_256
    enabled: true
    requires_graph_rebuild: false
    overrides:
      experiment.name: hidden_256
      training.hidden_dim: 256

  - name: learning_rate_001
    enabled: true
    requires_graph_rebuild: false
    overrides:
      experiment.name: learning_rate_001
      training.learning_rate.hdfs: 0.001
      training.learning_rate.bgl: 0.001

  - name: gamma_05
    enabled: true
    requires_graph_rebuild: false
    overrides:
      experiment.name: gamma_05
      training.gamma: 0.5

  - name: inner_product_structure
    enabled: true
    requires_graph_rebuild: false
    overrides:
      experiment.name: inner_product_structure
      ablation.graph.structure_decoder: inner_product

  - name: alpha_0
    enabled: true
    requires_graph_rebuild: false
    overrides:
      experiment.name: alpha_0
      training.alpha: 0.0

  - name: beta_0
    enabled: true
    requires_graph_rebuild: false
    overrides:
      experiment.name: beta_0
      training.beta: 0.0

  - name: gamma_0
    enabled: true
    requires_graph_rebuild: false
    overrides:
      experiment.name: gamma_0
      training.gamma: 0.0

  - name: lexical_node_recon
    enabled: true
    requires_graph_rebuild: false
    overrides:
      experiment.name: lexical_node_recon
      ablation.fusion.node_reconstruct: without_sbert
