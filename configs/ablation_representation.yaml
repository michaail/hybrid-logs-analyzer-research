# Family A — representation ablations.
# Each arm changes embeddings or graph tensors and MUST rebuild graph_dataset.pt
# locally, then train-only on Colab with that bundle. Never pair this matrix with
# a single shared --graph-dataset.
#
# Launch:
#   python scripts/prepare_hdfs_campaign.py --campaign-id <id> ...
#   python run_ablation.py --mode train-only --campaign-dir <campaign> --family A
family: representation
requires_graph_rebuild: true
experiments:
  - name: baseline_full
    enabled: true
    requires_graph_rebuild: true
    overrides:
      experiment.name: baseline_full
      ablation.llm_enrichment_enabled: true
      ablation.enrichment_model_size: large
      ablation.embeddings.tfidf_enabled: true
      ablation.embeddings.sbert_enabled: true
      ablation.graph.use_edge_features: true
      ablation.feature_contract: notebook_raw_v1

  - name: no_llm_enrichment
    enabled: true
    requires_graph_rebuild: true
    overrides:
      experiment.name: no_llm_enrichment
      ablation.llm_enrichment_enabled: false
      ablation.embeddings.tfidf_enabled: true
      ablation.embeddings.sbert_enabled: true
      ablation.graph.use_edge_features: true
      ablation.feature_contract: notebook_raw_v1

  - name: tfidf_only
    enabled: true
    requires_graph_rebuild: true
    overrides:
      experiment.name: tfidf_only
      ablation.llm_enrichment_enabled: false
      ablation.embeddings.tfidf_enabled: true
      ablation.embeddings.sbert_enabled: false
      ablation.graph.use_edge_features: true
      ablation.feature_contract: notebook_raw_v1

  - name: sbert_only
    enabled: true
    requires_graph_rebuild: true
    overrides:
      experiment.name: sbert_only
      ablation.llm_enrichment_enabled: true
      ablation.enrichment_model_size: large
      ablation.embeddings.tfidf_enabled: false
      ablation.embeddings.sbert_enabled: true
      ablation.graph.use_edge_features: true
      ablation.feature_contract: notebook_raw_v1

  - name: no_edge_features
    enabled: true
    requires_graph_rebuild: true
    overrides:
      experiment.name: no_edge_features
      ablation.llm_enrichment_enabled: true
      ablation.enrichment_model_size: large
      ablation.embeddings.tfidf_enabled: true
      ablation.embeddings.sbert_enabled: true
      ablation.graph.use_edge_features: false
      ablation.feature_contract: notebook_raw_v1

  - name: enrichment_small
    enabled: true
    requires_graph_rebuild: true
    overrides:
      experiment.name: enrichment_small
      ablation.llm_enrichment_enabled: true
      ablation.enrichment_model_size: small
      ablation.embeddings.tfidf_enabled: true
      ablation.embeddings.sbert_enabled: true
      ablation.graph.use_edge_features: true
      ablation.feature_contract: notebook_raw_v1

  - name: feature_contract_stabilized_v2
    enabled: true
    requires_graph_rebuild: true
    overrides:
      experiment.name: feature_contract_stabilized_v2
      ablation.llm_enrichment_enabled: true
      ablation.enrichment_model_size: large
      ablation.embeddings.tfidf_enabled: true
      ablation.embeddings.sbert_enabled: true
      ablation.graph.use_edge_features: true
      ablation.feature_contract: stabilized_v2
