[PROFILING]
enabled = False
report_sec = 60

[SNAPSHOT]
snapshot_interval_minutes = 5
compress_state = False

[DRAIN]
sim_th = 0.4
depth = 4
max_children = 100
max_clusters = 5000
extra_delimiters = []

[MASKING]
masking = [
  {"regex_pattern": "R\\d+-M\\d+-N[A-Z0-9]+(?:-[CI])?(?::J\\d+-U\\d+)?", "mask_with": "NODE"},
  {"regex_pattern": "(?:\\d{1,3}\\.){3}\\d{1,3}(?::\\d+)?", "mask_with": "IP"},
  {"regex_pattern": "\\b0x[0-9a-fA-F]+\\b", "mask_with": "HEX"},
  {"regex_pattern": "\\b[0-9a-fA-F]{8,}\\b", "mask_with": "ADDR"},
  {"regex_pattern": "\\bcore\\s+\\d+\\b", "mask_with": "CORE"},
  {"regex_pattern": "(?:/[\\w.\\-]+)+", "mask_with": "PATH"},
  {"regex_pattern": "\\b(?:reason|code)=\\S+", "mask_with": "REASON"}
  ]
mask_prefix = <
mask_suffix = >
